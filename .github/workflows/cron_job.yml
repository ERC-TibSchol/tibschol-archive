name: Scheduled Backup

on:
  schedule:
    # Runs daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install uv
      run: pip install uv

    - name: Install dependencies from pyproject.toml
      run: uv pip install --system .

    - name: Clean data folder
      run: rm -rf data/*

    - name: Fetch and save data
      env:
        TIBSCHOL_API_USERNAME: ${{ secrets.TIBSCHOL_API_USERNAME }}
        TIBSCHOL_API_PASSWORD: ${{ secrets.TIBSCHOL_API_PASSWORD }}
      run: python scripts/archive_data.py

    - name: Commit and push backup files
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/.
        if ! git diff --cached --quiet; then
          DATE_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "backup: scheduled run at $DATE_TIME"
          git push
        else
          echo "No changes to commit."
        fi
